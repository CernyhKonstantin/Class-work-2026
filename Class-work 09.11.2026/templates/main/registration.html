{% extends 'main/base.html' %}{% block title %}Registration{% endblock %}{% block content %}<section class="panel"><small>REGISTRATION FORM</small><h1>Create your account</h1><p>Enter your details. The form will send the data to the server as JSON.</p><form id="registration-form">{% csrf_token %}<div class="fields"><div><label for="first_name">First name</label><input id="first_name" name="first_name" required></div><div><label for="last_name">Last name</label><input id="last_name" name="last_name" required></div><div><label for="email">Email address</label><input id="email" name="email" type="email" required></div><div><label for="age">Age</label><input id="age" name="age" type="number" min="1" max="120" required></div><div class="full"><label for="address">Delivery address</label><textarea id="address" name="address" rows="3" required></textarea></div></div><label class="check"><input id="newsletter" type="checkbox"> I would like to receive news and updates.</label><button id="submit-button">Submit registration →</button></form><div id="response" role="status"></div></section><script>
const form=document.getElementById('registration-form');const box=document.getElementById('response');const button=document.getElementById('submit-button');
form.addEventListener('submit',async event=>{event.preventDefault();box.textContent='';button.disabled=true;const f=new FormData(form);const payload={first_name:f.get('first_name').trim(),last_name:f.get('last_name').trim(),email:f.get('email').trim(),age:f.get('age'),address:f.get('address').trim(),newsletter:document.getElementById('newsletter').checked};try{const response=await fetch("{% url 'register_api' %}",{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':form.querySelector('[name=csrfmiddlewaretoken]').value},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok||!result.success)throw new Error(result.message||'Registration failed.');box.className='success';box.textContent=result.message;form.reset();}catch(error){box.className='error';box.textContent=error.message;}finally{button.disabled=false;}});
</script>{% endblock %}
